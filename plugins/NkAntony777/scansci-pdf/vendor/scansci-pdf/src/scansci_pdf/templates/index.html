<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanSci PDF — Academic Paper Downloader</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
        header, main, footer { max-width: 52rem; margin: 0 auto; padding: 1rem 1.25rem; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: #fff; border-bottom: 1px solid #e2e8f0; max-width: none; }
        header > div { max-width: 52rem; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.125rem; margin: 0; }
        .muted, .hint { color: #64748b; font-size: 0.8rem; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.25rem; margin: 1.25rem 0; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        .row { display: flex; gap: 0.5rem; }
        input[type="text"] { flex: 1; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        button { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 0.55rem 0.9rem; cursor: pointer; }
        button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
        button.go { background: #059669; color: #fff; border-color: #059669; }
        button:disabled { background: #e2e8f0; color: #94a3b8; border-color: #e2e8f0; cursor: not-allowed; }
        .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .badge { font-size: 0.75rem; padding: 0.15rem 0.45rem; border-radius: 999px; background: #f1f5f9; color: #475569; }
        .badge.ok { background: #dcfce7; color: #166534; }
        .badge.bad { background: #fee2e2; color: #991b1b; }
        .badge.info { background: #dbeafe; color: #1d4ed8; }
        .error, .progress { border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .progress { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
        .paper, .history-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; gap: 1rem; }
        .paper h3 { margin: 0 0 0.25rem; font-size: 0.95rem; }
        .meta { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; }
        .hidden { display: none; }
        footer { color: #94a3b8; font-size: 0.75rem; text-align: center; border-top: 1px solid #e2e8f0; }
        ul { margin: 0.4rem 0 0; padding-left: 1.1rem; }
    </style>
</head>
<body>
<header>
    <div>
        <div>
            <h1>ScanSci PDF</h1>
            <p class="muted">Academic Paper Downloader</p>
        </div>
        <div id="status-badges" class="actions"></div>
    </div>
</header>
<main>
    <form id="query-form" class="card">
        <label for="query">Enter DOI, title, arXiv ID, or search keywords</label>
        <div class="row">
            <input id="query" type="text" autocomplete="off" placeholder="e.g. 10.1038/nature12373, or paper title...">
            <button id="submit-btn" class="primary" type="submit">Go</button>
        </div>
        <div class="actions">
            <button id="mode-search" type="button">Search Papers</button>
            <button id="mode-download" type="button" class="go">Direct Download</button>
        </div>
    </form>
    <div id="error" class="error hidden"></div>
    <div id="progress" class="progress hidden"></div>
    <div id="results"></div>
    <div id="history"></div>
    <div id="empty" class="card">
        <p>Enter a DOI, title, or keywords to start.</p>
        <p class="hint">Supports 13+ sources including Open Access, Sci-Hub, and institutional proxies.</p>
    </div>
</main>
<footer>ScanSci PDF — 13+ sources, parallel racing, institutional proxy support</footer>
<script nonce="__CSP_NONCE__">
(function () {
  const query = document.getElementById("query");
  const errorBox = document.getElementById("error");
  const progressBox = document.getElementById("progress");
  const resultsBox = document.getElementById("results");
  const historyBox = document.getElementById("history");
  const emptyBox = document.getElementById("empty");
  const badges = document.getElementById("status-badges");
  const modeSearch = document.getElementById("mode-search");
  const modeDownload = document.getElementById("mode-download");
  const state = { mode: "search", loading: false, downloading: false, history: [] };

  function text(value) {
    return document.createTextNode(value == null ? "" : String(value));
  }
  function show(node, on) { node.classList.toggle("hidden", !on); }
  function paintModes() {
    modeSearch.classList.toggle("primary", state.mode === "search");
    modeDownload.classList.toggle("go", state.mode === "download");
  }
  function clearError() { errorBox.replaceChildren(); show(errorBox, false); }
  function setError(message, hint, guidance) {
    errorBox.replaceChildren();
    const title = document.createElement("p");
    title.appendChild(text(message || "Request failed"));
    errorBox.appendChild(title);
    if (hint) {
      const p = document.createElement("p");
      p.className = "hint";
      p.appendChild(text(hint));
      errorBox.appendChild(p);
    }
    if (guidance && guidance.length) {
      const list = document.createElement("ul");
      guidance.forEach(function (item) {
        const li = document.createElement("li");
        li.appendChild(text(item));
        list.appendChild(li);
      });
      errorBox.appendChild(list);
    }
    show(errorBox, true);
  }
  function paintEmpty() {
    show(emptyBox, !state.loading && !state.downloading && !resultsBox.childElementCount && errorBox.classList.contains("hidden") && !state.history.length);
  }
  function badge(label, kind) {
    const span = document.createElement("span");
    span.className = "badge" + (kind ? " " + kind : "");
    span.appendChild(text(label));
    return span;
  }
  function paintStatus(data) {
    badges.replaceChildren();
    badges.appendChild(badge(data && data.status === "ok" ? "Online" : "Offline", data && data.status === "ok" ? "ok" : "bad"));
    const sources = (data && data.sources) || {};
    if (sources.cloakbrowser !== undefined) {
      badges.appendChild(badge("Browser: " + (sources.cloakbrowser ? "OK" : "Off"), sources.cloakbrowser ? "ok" : "bad"));
      badges.appendChild(badge("Tor: " + (sources.tor ? "OK" : "Off"), sources.tor ? "ok" : ""));
      if (sources.webvpn) badges.appendChild(badge("WebVPN", "info"));
      if (sources.carsi) badges.appendChild(badge("CARSI", "info"));
    }
  }
  function paintHistory() {
    historyBox.replaceChildren();
    if (!state.history.length) return;
    const heading = document.createElement("h2");
    heading.appendChild(text("Recent Downloads"));
    historyBox.appendChild(heading);
    state.history.forEach(function (item) {
      const row = document.createElement("div");
      row.className = "history-item";
      const title = document.createElement("span");
      title.appendChild(text(item.title || item.identifier));
      const source = document.createElement("span");
      source.className = "hint";
      source.appendChild(text(item.source));
      row.appendChild(title);
      row.appendChild(source);
      historyBox.appendChild(row);
    });
  }
  function paintResults(papers) {
    resultsBox.replaceChildren();
    if (!papers.length) return;
    const heading = document.createElement("h2");
    heading.appendChild(text(papers.length + " results found"));
    resultsBox.appendChild(heading);
    papers.forEach(function (paper) {
      const row = document.createElement("article");
      row.className = "paper";
      const body = document.createElement("div");
      const title = document.createElement("h3");
      title.appendChild(text(paper.title || paper.doi || "Unknown"));
      body.appendChild(title);
      const authors = paper.authors || [];
      if (authors.length) {
        const p = document.createElement("p");
        p.className = "hint";
        p.appendChild(text(authors.slice(0, 3).join(", ") + (authors.length > 3 ? " et al." : "")));
        body.appendChild(p);
      }
      const meta = document.createElement("div");
      meta.className = "meta hint";
      if (paper.year) meta.appendChild(text(paper.year));
      if (paper.doi) meta.appendChild(text(paper.doi));
      if (paper.is_oa) meta.appendChild(badge("Open Access", "ok"));
      if (paper.cited_by_count > 0) meta.appendChild(text("Cited: " + paper.cited_by_count));
      body.appendChild(meta);
      if (paper.abstract) {
        const abstract = document.createElement("p");
        abstract.className = "hint";
        abstract.appendChild(text(String(paper.abstract).slice(0, 200)));
        body.appendChild(abstract);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "go";
      button.appendChild(text("PDF"));
      button.disabled = state.downloading;
      button.addEventListener("click", function () { downloadPaper(paper.doi || paper.identifier); });
      row.appendChild(body);
      row.appendChild(button);
      resultsBox.appendChild(row);
    });
  }
  function detectMode() {
    const value = query.value.trim();
    if (/^10\.\d{4,}\//.test(value) || /^https?:\/\/doi\.org\//.test(value) || /^\d{4}\.\d{4,}/.test(value)) {
      state.mode = "download";
      paintModes();
    }
  }
  async function downloadPaper(identifier) {
    if (!identifier || state.downloading) return;
    state.downloading = true;
    clearError();
    const started = Date.now();
    show(progressBox, true);
    progressBox.textContent = "Downloading PDF... " + identifier;
    const timer = setInterval(function () {
      progressBox.textContent = "Downloading PDF... " + identifier + " (" + Math.floor((Date.now() - started) / 1000) + "s)";
    }, 1000);
    try {
      const resp = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier: identifier })
      });
      if (resp.ok && (resp.headers.get("content-type") || "").indexOf("application/pdf") !== -1) {
        const blob = await resp.blob();
        const cd = resp.headers.get("content-disposition") || "";
        const match = cd.match(/filename[*]?=(?:UTF-8''|"?)([^";]+)/i);
        const filename = match ? decodeURIComponent(match[1].replace(/"/g, "")) : "paper.pdf";
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        state.history.unshift({ title: filename.replace(/\.pdf$/i, ""), identifier: identifier, source: resp.headers.get("x-scansci-source") || "unknown" });
        if (state.history.length > 20) state.history.pop();
        paintHistory();
      } else {
        const data = await resp.json();
        setError(data.error || data.reason || "Download failed", data.hint && data.hint.message, data.guidance || []);
        if (data.sources) paintStatus({ status: "ok", sources: data.sources });
      }
    } catch (err) {
      setError("Network error: " + err.message);
    } finally {
      clearInterval(timer);
      state.downloading = false;
      show(progressBox, false);
      paintEmpty();
    }
  }
  async function searchPapers() {
    state.loading = true;
    clearError();
    paintResults([]);
    try {
      const resp = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query.value.trim(), limit: 10 })
      });
      if (!resp.ok) {
        const data = await resp.json();
        setError(data.error || "Search failed");
        return;
      }
      const papers = await resp.json();
      paintResults(papers);
      if (!papers.length) setError("No results found. Try different keywords.");
    } catch (err) {
      setError("Network error: " + err.message);
    } finally {
      state.loading = false;
      paintEmpty();
    }
  }
  function doAction() {
    if (!query.value.trim() || state.loading || state.downloading) return;
    if (state.mode === "download") downloadPaper(query.value.trim());
    else searchPapers();
  }
  document.getElementById("query-form").addEventListener("submit", function (event) {
    event.preventDefault();
    doAction();
  });
  query.addEventListener("input", function () { clearError(); detectMode(); paintEmpty(); });
  modeSearch.addEventListener("click", function () { state.mode = "search"; paintModes(); doAction(); });
  modeDownload.addEventListener("click", function () { state.mode = "download"; paintModes(); doAction(); });
  paintModes();
  fetch("/api/status").then(function (response) { return response.json(); }).then(paintStatus).catch(function () { paintStatus({ status: "offline" }); });
})();
</script>
</body>
</html>

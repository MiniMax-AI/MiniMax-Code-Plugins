[project]
name = "plant-public-mcp"
version = "0.1.0"
description = "植物抗病生物信息学公共接口 MCP：UniProt/NCBI/InterPro/PDB/AlphaFold + Ensembl Plants / Sol Genomics 等公开库"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.2.0",
]

[project.scripts]
plant-cli = "bio_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bio_toolkit"]

[project]
name = "microbe-mcp"
version = "0.1.0"
description = "下游微生物组/扩增子(16S·ITS) 分析 MCP 服务：把 vegan/DESeq2/edgeR/igraph/Hmisc/randomForest/ggtree 等一套微生物组分析出图脚本参数化封装为 MCP 工具，由本机 Rscript 引擎渲染 png+pdf"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
microbe-cli = "microbe_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microbe_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"mscripts" = "microbe_toolkit/mscripts"
